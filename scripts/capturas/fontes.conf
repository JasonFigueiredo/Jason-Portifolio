<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonte padrão do Chrome no contêiner de gravação (ver abrirNavegador, em
  ferramentas.mjs).

  O QualiPT escreve com a fonte do sistema: system-ui, Segoe UI, Roboto, Arial.
  O contêiner não tem nenhuma delas e cairia na DejaVu Sans, larga e pesada,
  que ninguém que usa o app vê. A Liberation Sans tem as medidas da Arial, que
  está na própria lista do app. As outras páginas gravadas trazem as próprias
  fontes e não passam por aqui.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
