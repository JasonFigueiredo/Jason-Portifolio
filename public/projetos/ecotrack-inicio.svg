<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 640" role="img" aria-label="Tela inicial do EcoTrack">
  <rect width="380" height="640" rx="28" fill="#0d1512" stroke="#1f3a2e" stroke-width="2"/>
  <rect x="140" y="14" width="100" height="8" rx="4" fill="#1f3a2e"/>
  <text x="24" y="72" fill="#e8f5ee" font-family="sans-serif" font-size="20" font-weight="600">Olá, Jason</text>
  <text x="24" y="94" fill="#5f8a74" font-family="sans-serif" font-size="12">Sua pegada desta semana</text>
