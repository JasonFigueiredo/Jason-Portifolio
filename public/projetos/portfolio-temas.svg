<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="O portfólio nos temas claro e escuro">
  <defs><clipPath id="metade"><rect x="400" y="0" width="400" height="500"/></clipPath></defs>
  <!-- lado escuro -->
  <rect width="800" height="500" fill="#111111"/>
  <rect x="0" y="0" width="60" height="500" fill="#2a2a2a"/>
  <g fill="#3a3a3a"><rect x="18" y="40" width="24" height="24" rx="6"/><rect x="18" y="76" width="24" height="24" rx="6"/>
    <rect x="18" y="112" width="24" height="24" rx="6"/><rect x="18" y="148" width="24" height="24" rx="6"/></g>
  <text x="110" y="150" fill="#f5f5f5" font-family="Georgia, serif" font-size="46" font-weight="700">Jason Figueiredo</text>
  <rect x="110" y="182" width="300" height="9" rx="4" fill="#3f3f3f"/>
  <rect x="110" y="204" width="220" height="9" rx="4" fill="#3f3f3f"/>
  <rect x="110" y="248" width="140" height="40" rx="8" fill="#f5f5f5"/>
  <rect x="266" y="248" width="120" height="40" rx="8" fill="none" stroke="#3f3f3f"/>
  <g><rect x="110" y="332" width="180" height="128" rx="8" fill="#1a1a1a" stroke="#2e2e2e"/>
     <rect x="310" y="332" width="180" height="128" rx="8" fill="#1a1a1a" stroke="#2e2e2e"/>
     <rect x="510" y="332" width="180" height="128" rx="8" fill="#1a1a1a" stroke="#2e2e2e"/></g>
  <!-- lado claro sobreposto -->
  <g clip-path="url(#metade)">
    <rect width="800" height="500" fill="#ffffff"/>
    <text x="110" y="150" fill="#1a1a1a" font-family="Georgia, serif" font-size="46" font-weight="700">Jason Figueiredo</text>
    <rect x="110" y="182" width="300" height="9" rx="4" fill="#d4d7dd"/>
    <rect x="110" y="204" width="220" height="9" rx="4" fill="#d4d7dd"/>
    <rect x="110" y="248" width="140" height="40" rx="8" fill="#1a1a1a"/>
    <rect x="266" y="248" width="120" height="40" rx="8" fill="none" stroke="#d4d7dd"/>
    <rect x="110" y="332" width="180" height="128" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>
    <rect x="310" y="332" width="180" height="128" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>
    <rect x="510" y="332" width="180" height="128" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>
  </g>
  <line x1="400" y1="0" x2="400" y2="500" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="400" cy="250" r="22" fill="#8b5cf6"/>
  <path d="M400 238 a12 12 0 0 0 0 24 z" fill="#ffffff"/>
</svg>
