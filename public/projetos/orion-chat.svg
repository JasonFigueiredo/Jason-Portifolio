<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Tela de chat do Orion">
  <rect width="800" height="500" fill="#0f1115"/>
  <!-- trilho de servidores -->
  <rect x="0" y="0" width="64" height="500" fill="#16181f"/>
  <circle cx="32" cy="44" r="18" fill="#5b6cff"/>
  <circle cx="32" cy="94" r="18" fill="#2a2f3a"/>
  <circle cx="32" cy="144" r="18" fill="#2a2f3a"/>
  <rect x="20" y="186" width="24" height="24" rx="12" fill="#2a2f3a"/>
  <!-- lista de canais -->
  <rect x="64" y="0" width="196" height="500" fill="#14161d"/>
  <rect x="82" y="28" width="120" height="10" rx="5" fill="#3a4150"/>
  <g fill="#6b7280" font-family="sans-serif" font-size="13">
    <text x="82" y="76"># geral</text>
    <text x="82" y="108"># projetos</text>
    <text x="82" y="140"># aleatório</text>
  </g>
  <rect x="72" y="60" width="180" height="24" rx="6" fill="#232733"/>
  <text x="82" y="76" fill="#e5e7eb" font-family="sans-serif" font-size="13"># geral</text>
  <text x="82" y="186" fill="#3a4150" font-family="sans-serif" font-size="11" letter-spacing="1">CANAIS DE VOZ</text>
  <rect x="72" y="200" width="180" height="46" rx="6" fill="#1b2030"/>
  <text x="82" y="220" fill="#5b6cff" font-family="sans-serif" font-size="13">🔊 Sala 1</text>
  <circle cx="90" cy="236" r="7" fill="#3ecf8e"/><circle cx="106" cy="236" r="7" fill="#f5a524"/>
  <text x="124" y="240" fill="#6b7280" font-family="sans-serif" font-size="11">2 na chamada · 14:32</text>
  <!-- mensagens -->
  <g font-family="sans-serif">
    <circle cx="292" cy="80" r="16" fill="#5b6cff"/>
    <rect x="320" y="66" width="90" height="9" rx="4" fill="#5b6cff"/>
    <rect x="320" y="84" width="340" height="8" rx="4" fill="#2a2f3a"/>
    <rect x="320" y="100" width="250" height="8" rx="4" fill="#2a2f3a"/>
    <circle cx="292" cy="164" r="16" fill="#3ecf8e"/>
    <rect x="320" y="150" width="70" height="9" rx="4" fill="#3ecf8e"/>
    <rect x="320" y="168" width="300" height="8" rx="4" fill="#2a2f3a"/>
    <!-- previa de link -->
    <rect x="320" y="192" width="280" height="72" rx="6" fill="#1b1e26" stroke="#2a2f3a"/>
    <rect x="332" y="204" width="48" height="48" rx="4" fill="#2a2f3a"/>
    <rect x="392" y="208" width="140" height="8" rx="4" fill="#3a4150"/>
    <rect x="392" y="224" width="190" height="7" rx="3" fill="#2a2f3a"/>
    <rect x="392" y="238" width="160" height="7" rx="3" fill="#2a2f3a"/>
    <circle cx="292" cy="308" r="16" fill="#f5a524"/>
    <rect x="320" y="294" width="84" height="9" rx="4" fill="#f5a524"/>
    <rect x="320" y="312" width="220" height="8" rx="4" fill="#2a2f3a"/>
    <text x="320" y="348" fill="#3a4150" font-size="12">Ana está digitando…</text>
  </g>
  <!-- campo de mensagem -->
  <rect x="292" y="430" width="480" height="42" rx="21" fill="#1b1e26" stroke="#2a2f3a"/>
  <text x="312" y="456" fill="#3a4150" font-family="sans-serif" font-size="13">Mensagem em #geral</text>
</svg>
