<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 640" role="img" aria-label="Histórico e calculadora de emissões do EcoTrack">
  <rect width="380" height="640" rx="28" fill="#0d1512" stroke="#1f3a2e" stroke-width="2"/>
  <rect x="140" y="14" width="100" height="8" rx="4" fill="#1f3a2e"/>
  <text x="24" y="72" fill="#e8f5ee" font-family="sans-serif" font-size="20" font-weight="600">Histórico</text>
  <text x="24" y="94" fill="#5f8a74" font-family="sans-serif" font-size="12">Últimos 6 meses</text>
  <!-- barras -->
  <g>
    <rect x="34" y="180" width="38" height="140" rx="5" fill="#1f3a2e"/>
    <rect x="34" y="238" width="38" height="82" rx="5" fill="#3ecf8e"/>
    <rect x="90" y="180" width="38" height="140" rx="5" fill="#1f3a2e"/>
    <rect x="90" y="216" width="38" height="104" rx="5" fill="#3ecf8e"/>
    <rect x="146" y="180" width="38" height="140" rx="5" fill="#1f3a2e"/>
    <rect x="146" y="252" width="38" height="68" rx="5" fill="#3ecf8e"/>
    <rect x="202" y="180" width="38" height="140" rx="5" fill="#1f3a2e"/>
    <rect x="202" y="270" width="38" height="50" rx="5" fill="#3ecf8e"/>
    <rect x="258" y="180" width="38" height="140" rx="5" fill="#1f3a2e"/>
    <rect x="258" y="262" width="38" height="58" rx="5" fill="#3ecf8e"/>
    <rect x="314" y="180" width="38" height="140" rx="5" fill="#1f3a2e"/>
    <rect x="314" y="286" width="38" height="34" rx="5" fill="#3ecf8e"/>
  </g>
  <g fill="#5f8a74" font-family="sans-serif" font-size="10" text-anchor="middle">
    <text x="53" y="340">abr</text><text x="109" y="340">mai</text><text x="165" y="340">jun</text>
    <text x="221" y="340">jul</text><text x="277" y="340">ago</text><text x="333" y="340">set</text>
  </g>
  <!-- calculadora -->
  <rect x="24" y="376" width="332" height="150" rx="10" fill="#12211a" stroke="#1f3a2e"/>
  <text x="44" y="406" fill="#e8f5ee" font-family="sans-serif" font-size="14">Calculadora de emissões</text>
  <rect x="44" y="424" width="292" height="36" rx="8" fill="#0d1512" stroke="#1f3a2e"/>
  <text x="58" y="447" fill="#5f8a74" font-family="sans-serif" font-size="12">Carro · 24 km</text>
  <text x="44" y="492" fill="#5f8a74" font-family="sans-serif" font-size="11">EMISSÃO ESTIMADA</text>
  <text x="44" y="516" fill="#3ecf8e" font-family="sans-serif" font-size="20" font-weight="600">4,9 kg CO₂</text>
  <rect x="24" y="552" width="332" height="62" rx="10" fill="#12211a" stroke="#1f3a2e"/>
  <text x="44" y="578" fill="#e8f5ee" font-family="sans-serif" font-size="13">💡 Dica do dia</text>
  <text x="44" y="598" fill="#5f8a74" font-family="sans-serif" font-size="11">Trocar 2 trajetos por transporte público</text>
</svg>
